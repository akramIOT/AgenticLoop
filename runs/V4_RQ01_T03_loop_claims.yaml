    Difference $t_P - t_T = 2.8 - 1.8 = 1$ hour. This matches.\n\n**Step 6: Determine\
    \ $m$ and $n$.**\nThe distance is $d = \\frac{252}{25}$.\n$m = 252$, $n = 25$.\n\
